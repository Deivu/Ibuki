[package]
name = "ibuki"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
base64 = "0.23.1"
flume = "0.12.0"
dashmap = "7.0.0-rc2"
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures = "0.3.34"
async-trait = "0.1.92"
serde_json = "1.0.151"
tower = "0.5.3"
byteorder = "1.5.0"
thiserror = "2.0.20"
cap = "0.1.2"
perf_monitor = "0.2.1"
regex = "1.13.1"
hex = "0.4.3"
cbc = "0.2.1"
rand_agents = "1.0.0"
block-padding = "0.4.2"

[dependencies.mimalloc]
version = "0.1.48"
features = ["v3"]

[dependencies.kameo]
git = "https://github.com/tqwewe/kameo.git"
rev = "abf132c2f369ac84f98aeedf789c64d71501d95e"

[dependencies.uuid]
version = "^1.24.1"
features = ["v4", "v7"]

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["blocking", "json"]

[dependencies.tokio]
version = "1.53.1"
features = ["tracing", "macros", "signal", "rt-multi-thread"]

[dependencies.songbird]
version = "0.6.0"
features = ["driver", "tungstenite", "rustls"]

[dependencies.symphonia]
version = "0.6.1"
features = ["all"]

[dependencies.axum]
default-features = true
features = ["ws"]
version = "0.8.9"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]
