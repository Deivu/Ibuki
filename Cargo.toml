[package]
name = "ibuki"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
flume = "0.12.0"
dashmap = "7.0.0-rc2"
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures = "0.3.34"
async-trait = "0.1.92"
serde_json = "1.0.151"
tower = "0.5.3"
byteorder = "1.5.0"
cap = "0.1.2"
perf_monitor = "0.2.1"
regex = "1.13.1"
hex = "0.4.3"
cbc = "0.2.1"
rand_agents = "1.0.0"
block-padding = "0.4.2"
anyhow = "1.0.104"
bytesize = "2.7.0"
rustls = { version = "0.23.43", features = ["ring"] }
tokio-util = { features = ["io"], optional = true, version = "0.7" }

[dependencies.impero-source]
git = "https://github.com/Deivu/Impero.git"
rev = "9fa24dc4a15bcd2566fe3fb09b1b5fbb23b730f7"

[dependencies.impero-filter]
git = "https://github.com/Deivu/Impero.git"
rev = "9fa24dc4a15bcd2566fe3fb09b1b5fbb23b730f7"

[dependencies.mimalloc]
version = "0.1.48"
features = ["v3"]

[dependencies.kameo]
git = "https://github.com/tqwewe/kameo.git"
rev = "abf132c2f369ac84f98aeedf789c64d71501d95e"

[dependencies.uuid]
version = "^1.24.1"
features = ["v4", "v7"]

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["blocking", "json"]

[dependencies.tokio]
version = "1.53.1"
features = ["tracing", "macros", "signal", "rt-multi-thread"]

[dependencies.songbird]
version = "=0.6.0"
features = ["driver", "tungstenite", "rustls"]

[dependencies.symphonia]
version = "=0.5.5"
features = ["all"]

[dependencies.axum]
default-features = true
features = ["ws"]
version = "0.8.9"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]
